name: CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: "make the GitHub release v<VERSION> from this commit"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  test:
    name: build, lint, unit tests (debian:trixie)
    runs-on: ubuntu-latest
    container: debian:trixie
    steps:
      - name: Tools
        run: |
          apt-get update -q
          DEBIAN_FRONTEND=noninteractive apt-get install -y -q --no-install-recommends \
            python3 shellcheck openssl ca-certificates git
      - uses: actions/checkout@v5
      - name: Build install-eris.sh
        run: bash src/build.sh /tmp/install-eris.sh
      - name: The committed install-eris.sh is the built one
        run: cmp /tmp/install-eris.sh install-eris.sh
      - name: bash -n
        run: for f in install-eris.sh src/install-head.sh src/build.sh src/eris-uninstall src/fw-rollback src/prompt.bash tests/*.sh; do bash -n "$f"; done
      - name: shellcheck
        run: |
          shellcheck --version | head -n 2
          shellcheck -S warning install-eris.sh src/install-head.sh src/build.sh src/eris-uninstall src/fw-rollback tests/*.sh
          shellcheck -s bash -S warning src/prompt.bash
      - name: Python syntax
        run: |
          python3 -m py_compile src/*.py
          python3 -c "compile(open('src/eris').read(), 'src/eris', 'exec')"
      - name: Unit tests
        run: python3 -W error::ResourceWarning -m unittest discover -s tests -v

  install:
    name: real install in a systemd container (${{ matrix.mode }})
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mode: [fresh, upgrade]
    steps:
      - uses: actions/checkout@v5
      - name: install-eris.sh in debian:trixie with systemd
        run: bash tests/ci-install.sh ${{ matrix.mode }}

  release:
    name: GitHub release
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release)
    needs: [test, install]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: Build and check the version
        run: |
          bash src/build.sh "$PWD/install-eris.sh"
          v=$(sed -n 's/^VERSION=//p' src/install-head.sh)
          tag=v$v
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$tag" != "$GITHUB_REF_NAME" ]; then echo "tag $GITHUB_REF_NAME but VERSION=$v"; exit 1; fi
          echo "TAG=$tag" >> "$GITHUB_ENV"
          grep -q "^VERSION = \"$v\"" src/erislib.py
          awk -v v="$v" '$0 ~ "^## " v {on=1; next} /^## / {on=0} on' CHANGELOG.md > notes.md
          cat notes.md
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" install-eris.sh --clobber
          else
            gh release create "$TAG" install-eris.sh --target "$GITHUB_SHA" --title "ERIS Console ${TAG#v}" --notes-file notes.md --latest
          fi
